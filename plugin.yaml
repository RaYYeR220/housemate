name: housemate
label: Housemate
kind: platform
version: "0.1.0"
description: >
  Hands-free Hermes in every room. Any old phone, tablet or laptop with a
  browser becomes a room speaker: say the wake word, ask, and hear the answer
  in the same room. One household conversation across rooms, timers that ring
  where you set them, intercom, room screens and spoken approvals.
author: RaYYeR220
requires_hermes: ">=0.23.0"
# Agent tools (toolset "housemate"). Declared so Hermes imports tools.py and
# registers them in every process (CLI, TUI, Desktop) while the adapter stays deferred.
provides_tools:
  - housemate_rooms
  - housemate_announce
  - housemate_timer_set
  - housemate_alarm_set
  - housemate_timer_list
  - housemate_timer_cancel
  - housemate_show
# pre_llm_call applies spoken answers (approve/deny, a clarify choice, "stop") sent to the
# housemate-answers side chat and vetoes that side turn; it ignores every other message.
provides_hooks:
  - pre_llm_call
optional_env:
  - name: HOUSEMATE_HOME_CHANNEL
    description: "Room that receives cron deliveries by default (e.g. kitchen)"
    prompt: "Default room for cron delivery"
    password: false
  - name: HOUSEMATE_ALLOWED_DEVICES
    description: "Comma-separated paired device ids allowed to talk to Hermes (empty = every paired device)"
    prompt: "Allowed device ids"
    password: false
