name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UV_EXCLUDE_NEWER: "3 days"
      HERMES_HOME: ${{ github.workspace }}/.hermes-ci
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          path: housemate
      # Hermes v0.23 declares its runtime dependencies for Python >= 3.14 only
      # (3.11 is an install bridge, never a runtime), so the plugin is tested on 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Install Hermes v0.23.0
        run: |
          git clone --branch v0.23.0 --depth 1 https://github.com/NousResearch/hermes-agent hermes-agent
          cd hermes-agent
          uv sync --frozen --python "$(command -v python3.14)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install plugin and test dependencies
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('housemate/pyproject.toml', 'rb'))['project']['dependencies']))" > plugin-deps.txt
          uv pip install --python hermes-agent/.venv/bin/python -r plugin-deps.txt -r housemate/requirements-dev.txt
      - name: Tests
        run: |
          cd housemate
          "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/python" -m pytest -q -m "not slow"
      - name: Plugin doctor
        run: hermes plugins doctor housemate --ci
      - name: Catalog validation
        run: hermes plugins validate housemate --install-deps
