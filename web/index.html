<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housemate</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1c1c1a; --muted: #6b6a66; --accent: #2f6f5e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe6; --muted: #9a9890; --accent: #7cc4ad; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 24px; letter-spacing: .02em; }
  .code { font: 600 3rem/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .15em; margin: 12px 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .status { font-size: 1.4rem; margin: 12px 0; }
  form { display: flex; gap: 8px; margin-top: 20px; }
  select, input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--muted);
                          background: transparent; color: inherit; min-height: 44px; }
  select, input { flex: 1; min-width: 0; }
  button { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Housemate</h1>

  <section id="connecting">
    <p class="status">Connecting&hellip;</p>
    <p class="muted" id="conn-detail"></p>
  </section>

  <section id="pairing" hidden>
    <p class="muted">Pair this device. Approve this code on the Rooms page, or run</p>
    <p class="muted"><code>hermes housemate pair <span id="code-inline"></span></code></p>
    <p class="code" id="code" aria-live="polite"></p>
    <p class="muted">The code expires in 10 minutes.</p>
  </section>

  <section id="expired" hidden>
    <p class="status">The pairing code expired.</p>
    <button type="button" id="retry">Get a new code</button>
  </section>

  <section id="paired" hidden>
    <p class="status" id="paired-status">Paired</p>
    <p class="muted" id="room-label">Pick the room this device lives in.</p>
    <form id="room-form">
      <label for="room-select" hidden>Room</label>
      <select id="room-select"></select>
      <input id="room-new" placeholder="New room name" maxlength="64" hidden>
      <button type="submit">Set room</button>
    </form>
  </section>

  <p class="muted" id="error" role="status"></p>
</main>
<script>
(() => {
  "use strict";
  const NEW_ROOM = "__new__";
  const $ = (id) => document.getElementById(id);

  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, value) {
    try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch (e) { /* private mode */ }
  }
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
  }

  let deviceId = load("housemate.device_id");
  if (!deviceId) { deviceId = newId(); save("housemate.device_id", deviceId); }
  const deviceName = load("housemate.name") || "Satellite";

  let ws = null;
  let backoff = 1000;
  let stopped = false;

  function show(section) {
    for (const id of ["connecting", "pairing", "expired", "paired"]) $(id).hidden = id !== section;
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function fillRooms(rooms, current) {
    const sel = $("room-select");
    sel.textContent = "";
    for (const r of rooms || []) {
      const opt = document.createElement("option");
      opt.value = r.name;
      opt.textContent = r.name;
      if (r.slug === current) opt.selected = true;
      sel.appendChild(opt);
    }
    const add = document.createElement("option");
    add.value = NEW_ROOM;
    add.textContent = "New room…";
    sel.appendChild(add);
    $("room-new").hidden = sel.value !== NEW_ROOM;
  }

  function setRoomLabel(name) {
    $("paired-status").textContent = name ? "Paired · " + name : "Paired";
    $("room-label").textContent = name ? "This device is in " + name + "." : "Pick the room this device lives in.";
  }

  function onMessage(msg) {
    switch (msg.type) {
      case "pair.code":
        $("code").textContent = msg.code;
        $("code-inline").textContent = msg.code;
        show("pairing");
        break;
      case "paired":
        save("housemate.device_key", msg.device_key);
        fillRooms(msg.rooms, msg.room);
        setRoomLabel(msg.room_name || "");
        show("paired");
        break;
      case "state":
        if (msg.room_name) setRoomLabel(msg.room_name);
        break;
      case "error":
        if (msg.code === "pairing_expired") { stopped = true; show("expired"); }
        else $("error").textContent = msg.message || msg.code;
        break;
      default:
        break;  // captions, cards, playback: the full satellite (later) handles these
    }
  }

  function connect() {
    stopped = false;
    show("connecting");
    $("error").textContent = "";
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      backoff = 1000;
      const hello = { type: "hello", device_id: deviceId, name: deviceName, ua: navigator.userAgent.slice(0, 512) };
      const key = load("housemate.device_key");
      if (key) hello.device_key = key;
      send(hello);
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data !== "string") return;  // playout audio: not handled by this placeholder
      try { onMessage(JSON.parse(ev.data)); } catch (e) { /* ignore malformed */ }
    };
    ws.onclose = (ev) => {
      ws = null;
      if (ev.code === 4401) save("housemate.device_key", null);  // key no longer valid: pair again
      if (ev.code === 4409) { $("conn-detail").textContent = "Opened on another tab."; show("connecting"); return; }
      if (stopped) return;
      $("conn-detail").textContent = "Reconnecting…";
      show("connecting");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 15000);
    };
  }

  $("room-select").addEventListener("change", () => {
    $("room-new").hidden = $("room-select").value !== NEW_ROOM;
  });
  $("room-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const sel = $("room-select").value;
    const room = (sel === NEW_ROOM ? $("room-new").value : sel).trim();
    if (room) send({ type: "room.set", room: room });
  });
  $("retry").addEventListener("click", connect);

  connect();
})();
</script>
</body>
</html>
